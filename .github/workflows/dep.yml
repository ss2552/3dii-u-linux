name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  linux-build:
    # コンテナ(Debian bullseye, glibc 2.31)では最新の PySide6 の wheel が入らないため、
    # ホストの ubuntu-26.04 で実行し、devkitPro だけイメージから取り出して使う
    runs-on: ubuntu-26.04
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITPPC: /opt/devkitpro/devkitPPC

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare /opt/devkitpro
        shell: bash
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" /opt/devkitpro

      # 取り出し + wut のビルド結果をキャッシュする(wut などを更新し直したいときは key の v2 を上げる)
      - name: Cache devkitPro toolchain
        id: dkp-cache
        uses: actions/cache@v4
        with:
          path: /opt/devkitpro
          key: devkitpro-dkp20260503-wut-master-v2

      - name: Extract devkitPro toolchain (Wii U)
        if: steps.dkp-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          # docker cp はコンテナ外を指すシンボリックリンクで失敗するため、tar でそのまま取り出す
          # devkitPPC は新しめの公式イメージを使う(古い wiiu-env のイメージは newlib が古く、最新の wut をビルドできない)
          docker run --rm --entrypoint tar devkitpro/devkitppc:20260503 \
            -C /opt -cf - devkitpro | tar -xf - --no-same-owner -C /opt
          # 公式イメージには wut-tools (elf2rpl など) が無いため、wiiu-env のイメージから補う
          docker run --rm --entrypoint tar ghcr.io/wiiu-env/devkitppc:20240505 \
            -C /opt/devkitpro -cf - tools | tar -xf - --no-same-owner --skip-old-files -C /opt/devkitpro

      # wut は thread API 1.9.2 以上が必要なため、ソースからビルドして入れる
      # pkg.devkitpro.org の pacman は GitHub のランナーから 403 になったため使わない
      - name: Update wut (build from source)
        if: steps.dkp-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="/opt/devkitpro/tools/bin:/opt/devkitpro/devkitPPC/bin:$PATH"
          git clone --depth 1 https://github.com/devkitPro/wut.git /tmp/wut
          make -C /tmp/wut -j"$(nproc)"
          make -C /tmp/wut install

      - name: Add devkitPro to PATH
        shell: bash
        run: |
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/devkitPPC/bin" >> "$GITHUB_PATH"

      - name: Verify devkitPro Wii U toolchain
        shell: bash
        run: |
          set -euxo pipefail
          test -x "$DEVKITPPC/bin/powerpc-eabi-gcc"
          test -x "$DEVKITPRO/tools/bin/elf2rpl"
          test -f "$DEVKITPRO/wut/share/wut.ld"

      # Python 3.14 は uv で用意する
      - name: Set up Python 3.14 (uv)
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --silent --show-error --location https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv venv --seed --python 3.14 .venv

      - name: Install project build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p third_party/cafeglsl builder/bin
          curl --fail --silent --show-error --location \
            https://github.com/Exzap/CafeGLSL/releases/download/v0.2.0/glslcompiler.elf \
            --output third_party/cafeglsl/glslcompiler
          chmod +x third_party/cafeglsl/glslcompiler

          curl --fail --silent --show-error --location \
            https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip \
            --output /tmp/makerom.zip
          unzip -p /tmp/makerom.zip makerom > builder/bin/makerom
          chmod +x builder/bin/makerom

          curl --fail --silent --show-error --location \
            https://github.com/J-Glitch2502/3dii-u/releases/download/deps-1/3dii-u-deps-1.zip \
            --output /tmp/3dii-u-deps-1.zip

          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install PySide6-Essentials pyctr pycryptodome cryptography
          .venv/bin/python tools/setup.py --deps-archive /tmp/3dii-u-deps-1.zip

      - name: Run project checks
        run: |
          .venv/bin/python tools/selftest.py
          .venv/bin/python tools/test_linux_build.py --full

      - name: Produce Linux bundle
        run: .venv/bin/python builder/make_linux_zip.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3diiu-linux
          path: builder/dist/3Dii U Builder Linux.zip
          if-no-files-found: error

  release:
    # v* タグを push したときだけ GitHub Release を作成する
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux-build
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: 3diiu-linux
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mv "dist/3Dii U Builder Linux.zip" dist/3diiu-linux.zip
          gh release create "$GITHUB_REF_NAME" dist/3diiu-linux.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
