name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  linux-build:
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/wiiu-env/devkitppc:20240505
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITPPC: /opt/devkitpro/devkitPPC

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # コンテナは Debian bullseye (EOL) のため、apt の参照先を archive.debian.org に切り替える
      - name: Install host build tools
        shell: bash
        run: |
          set -eux
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do
            [ -f "$f" ] || continue
            sed -i \
              -e '/bullseye-updates/d' \
              -e 's|http://deb.debian.org/debian-security|http://archive.debian.org/debian-security|g' \
              -e 's|http://deb.debian.org/debian|http://archive.debian.org/debian|g' \
              -e 's|http://security.debian.org/debian-security|http://archive.debian.org/debian-security|g' \
              "$f"
          done
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99archive
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential curl unzip ca-certificates

      # ghcr.io/wiiu-env/devkitppc には wut / elf2rpl が入っている。足りない場合だけ pacman で追加する
      # (pkg.devkitpro.org は GitHub のランナーから 403 になることがあるため、通常は通信しない)
      - name: Ensure Wii U toolchain (wut)
        shell: bash
        run: |
          set -eux
          if [ ! -x "$DEVKITPRO/tools/bin/elf2rpl" ] || [ ! -f "$DEVKITPRO/wut/share/wut.ld" ]; then
            for i in 1 2 3; do
              dkp-pacman -Sy --noconfirm --needed wut wut-tools && break
              sleep 10
            done
          fi

      - name: Verify devkitPro Wii U toolchain
        shell: bash
        run: |
          set -euxo pipefail
          command -v dkp-pacman
          test -x "$DEVKITPPC/bin/powerpc-eabi-gcc"
          test -x "$DEVKITPRO/tools/bin/elf2rpl"
          test -f "$DEVKITPRO/wut/share/wut.ld"

      # Debian ベースのコンテナでは setup-python が使えない場合があるため uv で Python 3.14 を用意する
      - name: Set up Python 3.14 (uv)
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --silent --show-error --location https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv venv --seed --python 3.14 .venv

      - name: Install project build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p third_party/cafeglsl builder/bin
          curl --fail --silent --show-error --location \
            https://github.com/Exzap/CafeGLSL/releases/download/v0.2.0/glslcompiler.elf \
            --output third_party/cafeglsl/glslcompiler
          chmod +x third_party/cafeglsl/glslcompiler

          curl --fail --silent --show-error --location \
            https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip \
            --output /tmp/makerom.zip
          unzip -p /tmp/makerom.zip makerom > builder/bin/makerom
          chmod +x builder/bin/makerom

          curl --fail --silent --show-error --location \
            https://github.com/J-Glitch2502/3dii-u/releases/download/deps-1/3dii-u-deps-1.zip \
            --output /tmp/3dii-u-deps-1.zip

          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install PySide6-Essentials pyctr pycryptodome cryptography
          .venv/bin/python tools/setup.py --deps-archive /tmp/3dii-u-deps-1.zip

      - name: Run project checks
        run: |
          .venv/bin/python tools/selftest.py
          .venv/bin/python tools/test_linux_build.py --full

      - name: Produce Linux bundle
        run: .venv/bin/python builder/make_linux_zip.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3diiu-linux
          path: builder/dist/3Dii U Builder Linux.zip
          if-no-files-found: error

  release:
    # v* タグを push したときだけ GitHub Release を作成する
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux-build
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: 3diiu-linux
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mv "dist/3Dii U Builder Linux.zip" dist/3diiu-linux.zip
          gh release create "$GITHUB_REF_NAME" dist/3diiu-linux.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
